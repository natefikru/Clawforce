name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install dashboard dependencies
        run: pnpm --dir clawforce-dashboard install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test:unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install dashboard dependencies
        run: pnpm --dir clawforce-dashboard install --frozen-lockfile
      - name: Run integration tests
        run: pnpm test:integration

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install dashboard dependencies
        run: pnpm --dir clawforce-dashboard install --frozen-lockfile
      - name: Run smoke tests
        run: pnpm test:smoke

  typecheck:
    name: Type Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Run type checks
        run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install dashboard dependencies
        run: pnpm --dir clawforce-dashboard install --frozen-lockfile
      - name: Build root package
        run: pnpm build
      - name: Build dashboard
        run: pnpm --dir clawforce-dashboard build

  knip:
    name: Knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install dashboard dependencies
        run: pnpm --dir clawforce-dashboard install --frozen-lockfile
      - name: Run knip (root)
        run: pnpm knip --include dependencies,unlisted,unresolved
      - name: Run knip (dashboard)
        run: pnpm knip --directory clawforce-dashboard --include dependencies,unlisted,unresolved

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install dashboard dependencies
        run: pnpm --dir clawforce-dashboard install --frozen-lockfile
      - name: Run dependency security checks
        run: pnpm check:security
