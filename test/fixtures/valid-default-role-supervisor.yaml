name: "default-supervisor"

agents:
  - name: "supervisor-agent"
    role: "supervisor"
    supervises: ["worker"]
  - name: "worker"
    role: "inbox-analyst"

openclaw:
  default:
    channels:
      discord:
        enabled: true

models:
  cloud: "anthropic/claude-sonnet-4-5"
  provider_keys:
    anthropic: "${ANTHROPIC_API_KEY}"
