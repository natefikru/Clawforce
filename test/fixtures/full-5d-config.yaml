name: "five-dim-test"

agents:
  - name: "test-agent"
    role: "inbox-analyst"

openclaw:
  default:
    channels:
      discord:
        enabled: true

models:
  - name: claude
    id: "anthropic/claude-sonnet-4-5"
    type: cloud
    api_key: "${ANTHROPIC_API_KEY}"
  - name: llama
    id: "ollama/llama3.3:8b"
    type: local
    engine:
      runtime: ollama
      location: container
      model: "llama3.3:8b"
      port: 11434
  - name: gpt4o
    id: "openai/gpt-4o"
    type: cloud
    api_key: "${ANTHROPIC_API_KEY}"
  - name: qwen
    id: "sglang/qwen3-32b"
    type: local
    engine:
      runtime: sglang
      location: container
      model: "qwen3-32b"
      gpu: nvidia
      quantization: fp16
      port: 30000

routing:
  rules:
    - condition: "pii_detected"
      model: llama
    - condition: "low_complexity"
      model: llama
    - condition: "high_complexity"
      model: claude
    - condition: "domain_code"
      model: gpt4o
    - condition: "domain_writing"
      model: claude
    - condition: "over_budget"
      model: llama
  sensitivity:
    keywords:
      - "password"
      - "secret"
    pii_detection: true
    pii_confidence_threshold: 0.80
    pii_pattern_thresholds:
      ip_address: 0.50
  health_check:
    enabled: true
    interval_seconds: 10
    timeout_seconds: 3
    stale_after_seconds: 30
    failover_policy: "failover-safe"
    failure_threshold: 3
    recovery_threshold: 2
    retry_attempts: 2
    retry_delay_ms: 500
  budget:
    daily_limit: 10.00
    fallback_model: llama

compliance:
  enabled: true
  frameworks:
    - "hipaa"
    - "pci-dss"

dashboard:
  enabled: true
  auth:
    enabled: false
