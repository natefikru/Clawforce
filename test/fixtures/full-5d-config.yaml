name: "five-dim-test"

agents:
  - name: "test-agent"
    role: "inbox-analyst"

openclaw:
  default:
    channels:
      discord:
        enabled: true

models:
  cloud: "anthropic/claude-sonnet-4-5"
  local: "ollama/llama3.3:8b"
  provider_keys:
    anthropic: "${ANTHROPIC_API_KEY}"

routing:
  rules:
    - condition: "pii_detected"
      model: "ollama/llama3.3:8b"
    - condition: "low_complexity"
      model: "ollama/llama3.3:8b"
    - condition: "high_complexity"
      model: "anthropic/claude-sonnet-4-5"
    - condition: "domain_code"
      model: "openai/gpt-4o"
    - condition: "domain_writing"
      model: "anthropic/claude-sonnet-4-5"
    - condition: "over_budget"
      model: "ollama/llama3.3:8b"
  sensitivity:
    keywords:
      - "password"
      - "secret"
    pii_detection: true
    pii_confidence_threshold: 0.80
    pii_pattern_thresholds:
      ip_address: 0.50
  health_check:
    enabled: true
    interval_seconds: 10
    timeout_seconds: 3
    stale_after_seconds: 30
    failover_policy: "failover-safe"
    failure_threshold: 3
    recovery_threshold: 2
    retry_attempts: 2
    retry_delay_ms: 500
  budget:
    daily_limit: 10.00
    fallback_model: "ollama/llama3.3:8b"

local_model:
  engine: "sglang"
  model: "qwen3-32b"
  gpu: "nvidia"
  quantization: "fp16"
  port: 30000

compliance:
  enabled: true
  frameworks:
    - "hipaa"
    - "pci-dss"

dashboard:
  enabled: true
  auth:
    enabled: false
