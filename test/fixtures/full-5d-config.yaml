name: "five-dim-test"
role: "inbox-analyst"

openclaw:
  channels:
    discord:
      enabled: true

models:
  primary: "anthropic/claude-sonnet-4-5"
  local: "ollama/llama3.3:8b"
  api_key: "${ANTHROPIC_API_KEY}"

router:
  enabled: true
  rules:
    - condition: "pii_detected"
      model: "ollama/llama3.3:8b"
    - condition: "low_complexity"
      model: "ollama/llama3.3:8b"
    - condition: "high_complexity"
      model: "anthropic/claude-sonnet-4-5"
    - condition: "domain_code"
      model: "openai/gpt-4o"
    - condition: "domain_writing"
      model: "anthropic/claude-sonnet-4-5"
    - condition: "over_budget"
      model: "ollama/llama3.3:8b"
  sensitivity_keywords:
    - "password"
    - "secret"
  budget:
    daily_limit: 10.00
    fallback_model: "ollama/llama3.3:8b"

runtime:
  engine: "sglang"
  model: "qwen3-32b"
  gpu: "nvidia"
  quantization: "fp16"
  port: 30000

compliance:
  enabled: true

compliance_frameworks:
  - "hipaa"
  - "pci-dss"

dashboard:
  enabled: true
  auth:
    enabled: false
