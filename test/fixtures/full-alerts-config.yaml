name: "alerts-config"
role: "inbox-analyst"

openclaw:
  channels:
    discord:
      enabled: true

models:
  primary: "anthropic/claude-sonnet-4-5"
  local: "ollama/llama3.3:8b"
  api_key: "${ANTHROPIC_API_KEY}"

router:
  enabled: true

alerts:
  enabled: true
  types:
    model_health: true
    budget_exceeded: true
    pii_violation: true
    agent_error: false
    agent_idle: true
  idle:
    threshold_minutes: 45
    cooldown_minutes: 15
  budget:
    cooldown_minutes: 120
    auto_block_on_exceeded: true
  notifications:
    dashboard: true
    email:
      enabled: true
      smtp_host: "smtp.example.com"
      smtp_port: 587
      username: "alerts@example.com"
      password: "secret-password"
      from: "alerts@example.com"
      to:
        - "ops@example.com"
