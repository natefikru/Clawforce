name: "runtime-ollama"

agents:
  - name: "test-agent"
    workspace: "./workspaces/test-agent"

openclaw:
  default:
    channels:
      discord:
        enabled: true

models:
  - name: claude
    id: "anthropic/claude-sonnet-4-5"
    type: cloud
    api_key: "${ANTHROPIC_API_KEY}"
  - name: llama
    id: "ollama/llama3.3:8b"
    type: local
    engine:
      runtime: ollama
      location: container
      model: "llama3.3:8b"
