name: "phase1-test"

agents:
  - name: "test-agent"
    role: "inbox-analyst"

openclaw:
  default:
    channels:
      discord:
        enabled: true

models:
  - name: claude
    id: "anthropic/claude-sonnet-4-5"
    type: cloud
    api_key: "${ANTHROPIC_API_KEY}"
  - name: llama
    id: "ollama/llama3.3:8b"
    type: local
    engine:
      runtime: ollama
      location: container
      model: "llama3.3:8b"
      port: 11434

routing:
  rules:
    - condition: "pii_detected"
      model: llama
    - condition: "low_complexity"
      model: llama
    - condition: "high_complexity"
      model: claude
  sensitivity:
    keywords:
      - "password"
      - "secret"

compliance:
  enabled: true

dashboard:
  enabled: true
  port: 3001
  auth:
    enabled: false
