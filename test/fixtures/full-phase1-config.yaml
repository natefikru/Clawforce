name: "phase1-test"

agents:
  - name: "test-agent"
    role: "inbox-analyst"

openclaw:
  default:
    channels:
      discord:
        enabled: true

models:
  cloud: "anthropic/claude-sonnet-4-5"
  local: "ollama/llama3.3:8b"
  provider_keys:
    anthropic: "${ANTHROPIC_API_KEY}"

routing:
  rules:
    - condition: "pii_detected"
      model: "ollama/llama3.3:8b"
    - condition: "low_complexity"
      model: "ollama/llama3.3:8b"
    - condition: "high_complexity"
      model: "anthropic/claude-sonnet-4-5"
  sensitivity:
    keywords:
      - "password"
      - "secret"

compliance:
  enabled: true

dashboard:
  enabled: true
  port: 3001
  auth:
    enabled: false
