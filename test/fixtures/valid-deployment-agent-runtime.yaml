name: "minimal-agent-runtime"

agents:
  - name: "research-agent"
    role: "research-agent"

deployment:
  agent_runtime: "openclaw"

openclaw:
  default:
    channels:
      discord:
        enabled: true

models:
  cloud: "anthropic/claude-sonnet-4-5"
  provider_keys:
    anthropic: "${ANTHROPIC_API_KEY}"
