name: "runtime-e2e-local"

agents:
  - name: "inbox-analyst"
    workspace: "./workspaces/inbox-analyst"

openclaw:
  default:
    channels:
      discord:
        enabled: true

models:
  - name: llama
    id: "ollama/llama3.3:8b"
    type: local
    engine:
      runtime: ollama
      location: host
      host_url: "http://host.docker.internal:11434"
      model: "llama3.3:8b"

gateway:
  bind: "loopback"

routing:
  rules:
    - condition: "pii_detected"
      model: llama
    - condition: "low_complexity"
      model: llama
    - condition: "medium_complexity"
      model: llama
    - condition: "high_complexity"
      model: llama
    - condition: "domain_code"
      model: llama
    - condition: "domain_analysis"
      model: llama
    - condition: "over_budget"
      model: llama

compliance:
  enabled: true

dashboard:
  enabled: true
  port: 4412
  auth:
    enabled: false
