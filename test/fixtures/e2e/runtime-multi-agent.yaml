name: "runtime-e2e-multi"

agents:
  - name: "inbox-analyst"
    workspace: "./workspaces/inbox-analyst"
    routing:
      budget:
        daily_limit: 5.00

  - name: "research-agent"
    workspace: "./workspaces/research-agent"
    routing:
      budget:
        daily_limit: 8.00

openclaw:
  default:
    channels:
      discord:
        enabled: true

gateway:
  bind: "loopback"

routing:
  rules:
    - condition: "pii_detected"
      model: llama
    - condition: "low_complexity"
      model: llama
    - condition: "medium_complexity"
      model: llama
    - condition: "high_complexity"
      model: llama

models:
  - name: llama
    id: "ollama/llama3.3:8b"
    type: local
    engine:
      runtime: ollama
      location: host
      host_url: "http://host.docker.internal:11434"
      model: "llama3.3:8b"

compliance:
  enabled: true

dashboard:
  enabled: true
  port: 4414
  auth:
    enabled: false
