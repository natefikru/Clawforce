name: "runtime-e2e-hybrid"

agents:
  - name: "inbox-analyst"
    role: "inbox-analyst"

openclaw:
  default:
    channels:
      discord:
        enabled: true

models:
  - name: claude
    id: "anthropic/claude-sonnet-4-5"
    type: cloud
    api_key: "${ANTHROPIC_API_KEY}"
  - name: llama
    id: "ollama/llama3.3:8b"
    type: local
    engine:
      runtime: ollama
      location: host
      host_url: "http://host.docker.internal:11434"
      model: "llama3.3:8b"

gateway:
  bind: "loopback"

routing:
  rules:
    - condition: "pii_detected"
      model: llama
    - condition: "low_complexity"
      model: llama
    - condition: "high_complexity"
      model: claude
    - condition: "over_budget"
      model: llama
  budget:
    daily_limit: 10
    fallback_model: llama
  health_check:
    enabled: true
    interval_seconds: 10
    timeout_seconds: 3
    stale_after_seconds: 30
    failover_policy: "failover-safe"
    failure_threshold: 3
    recovery_threshold: 2
    retry_attempts: 1
    retry_delay_ms: 500

compliance:
  enabled: true

dashboard:
  enabled: true
  port: 4413
  auth:
    enabled: false
