name: "runtime-e2e-cloud"

agents:
  - name: "inbox-analyst"
    role: "inbox-analyst"

openclaw:
  default:
    channels:
      discord:
        enabled: true

models:
  cloud: "anthropic/claude-sonnet-4-5"
  credential_mode: "env"
  provider_keys:
    anthropic: "${ANTHROPIC_API_KEY}"

gateway:
  bind: "loopback"

routing: {}

compliance:
  enabled: true

dashboard:
  enabled: true
  port: 4411
  auth:
    enabled: false
