name: "test-corp"
role: "inbox-analyst"

openclaw:
  channels:
    discord:
      enabled: true

models:
  primary: "anthropic/claude-sonnet-4-5"
  local: "ollama/llama3.3:8b"
  api_key: "${ANTHROPIC_API_KEY}"

approval:
  mode: "hybrid"
  require_approval_for:
    - "browser"
    - "message.send"

sensitivity:
  blocklist:
    - "ssn"
    - "credit card"
  pii_detection: true

runtime:
  engine: "ollama"
  location: "container"
  model: "llama3.3:8b"
