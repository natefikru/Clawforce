name: "test-corp"

agents:
  - name: "test-agent"
    role: "inbox-analyst"

openclaw:
  default:
    channels:
      discord:
        enabled: true

models:
  cloud: "anthropic/claude-sonnet-4-5"
  local: "ollama/llama3.3:8b"
  provider_keys:
    anthropic: "${ANTHROPIC_API_KEY}"

approval:
  mode: "hybrid"
  require_approval_for:
    - "browser"
    - "message.send"

routing:
  sensitivity:
    keywords:
      - "ssn"
      - "credit card"
    pii_detection: true

local_model:
  engine: "ollama"
  location: "container"
  model: "llama3.3:8b"
