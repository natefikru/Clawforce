name: "full-routing"

models:
  - name: claude
    id: "anthropic/claude-sonnet-4-5"
    type: cloud
    api_key: "${ANTHROPIC_API_KEY}"
  - name: llama
    id: "ollama/llama3.3:8b"
    type: local
    engine:
      runtime: sglang
      model: "qwen3-32b"
      gpu: nvidia
      quantization: fp16
      port: 30000
  - name: gpt4o
    id: "openai/gpt-4o"
    type: cloud
    api_key: "${OPENAI_API_KEY}"

agents:
  - name: inbox-analyst
    workspace: "./workspaces/inbox-analyst"

routing:
  rules:
    - condition: "pii_detected"
      model: llama
    - condition: "low_complexity"
      model: llama
    - condition: "high_complexity"
      model: claude
    - condition: "domain_code"
      model: gpt4o
    - condition: "over_budget"
      model: llama
  priority: [policy, sensitivity, cost, domain, complexity]
  budget:
    daily_limit: 10.00
    fallback_model: llama
  sensitivity:
    keywords: ["password", "secret"]
    pii_detection: true
    pii_confidence_threshold: 0.80
    pii_pattern_thresholds:
      ip_address: 0.50
  policy:
    default_tier: internal
  health_check:
    enabled: true
    interval_seconds: 10
    timeout_seconds: 3
    stale_after_seconds: 30
    failover_policy: "failover-safe"
    failure_threshold: 3
    recovery_threshold: 2
    retry_attempts: 2
    retry_delay_ms: 500

compliance:
  enabled: true
  frameworks:
    - "hipaa"
    - "pci-dss"

dashboard:
  enabled: true
  auth:
    enabled: false

openclaw:
  default:
    channels:
      discord:
        enabled: true
