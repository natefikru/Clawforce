name: "test-ultron"

agents:
  - name: inbox-analyst
    role: inbox-analyst
    openclaw: support-instance
    routing:
      budget:
        daily_limit: 5.00

  - name: research-agent
    role: research-agent
    openclaw: research-instance
    routing:
      budget:
        daily_limit: 8.00

  - name: ultron
    role: supervisor
    openclaw: support-instance
    supervises: [inbox-analyst, research-agent]
    routing:
      budget:
        daily_limit: 3.00

openclaw:
  support-instance:
    channels:
      discord:
        enabled: true
  research-instance:
    channels:
      discord:
        enabled: true
