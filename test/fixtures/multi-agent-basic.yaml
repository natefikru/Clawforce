name: "test-workforce"

models:
  - name: claude
    id: "anthropic/claude-sonnet-4-5"
    type: cloud
    api_key: "${ANTHROPIC_API_KEY}"
  - name: llama
    id: "ollama/llama3.3:8b"
    type: local
    engine:
      runtime: ollama
      location: container
      model: "llama3.3:8b"
      port: 11434

routing:
  priority: [policy, sensitivity, cost, domain, complexity]
  sensitivity:
    keywords: [password, secret]

dashboard:
  enabled: true
  auth:
    enabled: false

agents:
  - name: inbox-analyst
    workspace: "./workspaces/inbox-analyst"
    routing:
      budget:
        daily_limit: 5.00

  - name: research-agent
    workspace: "./workspaces/research-agent"
    routing:
      budget:
        daily_limit: 8.00
      rules:
        - condition: high_complexity
          model: claude

openclaw:
  default:
    channels:
      discord:
        enabled: true
