name: "test-ultron"

agents:
  - name: inbox-analyst
    role: inbox-analyst
    routing:
      budget:
        daily_limit: 5.00

  - name: research-agent
    role: research-agent
    routing:
      budget:
        daily_limit: 8.00

  - name: ultron
    role: supervisor
    supervises: [inbox-analyst, research-agent]
    routing:
      budget:
        daily_limit: 3.00

openclaw:
  default:
    channels:
      discord:
        enabled: true
