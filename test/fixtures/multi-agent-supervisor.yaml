name: "test-ultron"

defaults:
  models:
    cloud: "anthropic/claude-sonnet-4-5"
    credential_mode: env
    provider_keys:
      anthropic: "${ANTHROPIC_API_KEY}"

agents:
  - name: inbox-analyst
    role: inbox-analyst
    channels:
      - type: channel
        channels: ["#inbox"]
    routing:
      budget_daily: 5.00

  - name: research-agent
    role: research-agent
    channels:
      - type: channel
        channels: ["#research"]
    routing:
      budget_daily: 8.00

  - name: ultron
    role: process-automator
    channels:
      - type: channel
        channels: ["#ai-ops"]
    supervises: [inbox-analyst, research-agent]
    routing:
      budget_daily: 3.00

openclaw:
  channels:
    discord:
      enabled: true
